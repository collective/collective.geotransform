# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.12.0"

[gitignore]
extra_lines = """
.lock
.venv
htmlcov/
.mxdev_cache/
requirements.txt
# robotsuite output
robot_*.html
robot_*.xml
/test_*/
"""

[pyproject]
# Minified third-party JavaScript
codespell_skip = "*.min.js"

[tox]
test_matrix = {"6.2" = ["3.13", "3.12", "3.11", "3.10"], "6.1" = ["3.13", "3.12", "3.11", "3.10"]}
constraints_files = {"6.2" = "https://dist.plone.org/release/6.2.3/constraints.txt", "6.1" = "https://dist.plone.org/release/6.1-latest/constraints.txt"}
# plone.meta always runs `rfbrowser init chromium` (it sees plone.app.robotframework).
# The Playwright pinned by Plone 6.1 refuses Ubuntu 26.04 (GitHub's ubuntu-latest):
# use the 24.04 build. The robot scenario runs on Selenium anyway.
test_environment_variables = """
    PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64
"""

[github]
jobs = [
    "qa",
    "coverage",
    "release_ready",
    "circular",
    "dependencies",
    ]
